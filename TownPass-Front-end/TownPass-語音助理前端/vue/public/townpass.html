<html lang="zh-Hant">

<style>
:root{--teal:#087d86;--dark:#086a72;--ink:#15252d;--muted:#60737c;--line:#d9e8eb;--pale:#e6f6f7;--pale2:#f5fbfc;--shadow:0 7px 22px rgba(18,65,72,.12);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 5%,#eef9fa,#fff 56%);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #65c9d0;outline-offset:3px}.round-icon{width:37px;height:37px;flex:0 0 37px;border-radius:50%;border:0;background:#eaf7f9;display:grid;place-items:center;color:#14333f}.main{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#cee5e8 transparent}.hero{height:150px;background:linear-gradient(150deg,#f8fefe,#e2f5f7);position:relative;overflow:hidden;display:flex;align-items:flex-start;padding:34px 27px}.hero:before,.hero:after{content:"";position:absolute;width:240px;height:100px;background:rgba(187,232,234,.36);border-radius:50%;bottom:-48px;left:-30px;transform:rotate(13deg)}.hero:after{left:auto;right:-95px;bottom:-55px;background:rgba(208,239,240,.8);transform:rotate(-10deg)}.hero-content{display:flex;align-items:center;gap:13px;position:relative;z-index:1;font-size:19px;font-weight:800}.avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(#e5fbfb,#bce6e8);color:var(--teal)}.home-surface{background:#fff;border-radius:29px 29px 0 0;margin-top:-19px;position:relative;min-height:calc(100% - 131px);padding:18px 22px 24px;display:flex;flex-direction:column;align-items:center}.mic-button{width:170px;height:170px;border-radius:50%;background:linear-gradient(135deg,#078a91,#075f69);color:#fff;border:9px solid #d7f1f3;box-shadow:0 0 0 6px #f4fbfb,0 7px 15px rgba(21,119,125,.17);display:grid;place-items:center;margin:12px auto 12px;transition:transform .14s,box-shadow .15s;touch-action:manipulation}.mic-button svg{width:75px;height:75px}.mic-button:active{transform:scale(.96)}.mic-button.listening{animation:pulse 1.5s infinite}.mic-button.listening svg{width:63px;height:63px}@keyframes pulse{0%,100%{box-shadow:0 0 0 6px #ecfafb,0 0 0 9px rgba(6,143,152,.09)}50%{box-shadow:0 0 0 8px #ddf4f5,0 0 0 18px rgba(6,143,152,.14)}}.home-title{font-size:23px;font-weight:850;margin:2px 0 4px}.home-sub{font-size:15px;color:#4b6670;text-align:center}.examples{margin-top:auto;width:100%;padding-top:24px}.examples-title{font-size:14px;font-weight:800;margin-bottom:10px}.chip-list{display:flex;flex-direction:column;align-items:center;gap:9px}.chip{border:1px solid #d6e9ed;border-radius:20px;background:#eaf6f8;padding:8px 18px;font-size:14px;color:#263d48;min-width:175px;box-shadow:0 2px 3px #edf4f5}.tap-hint{font-size:12px;color:#7a9198;text-align:center;margin-top:15px}.status-panel{width:100%;padding:12px 15px;border:1.5px solid #b9d8df;border-radius:17px;background:#f5fbfc;margin-top:21px}.status-label{font-size:12px;font-weight:800;color:#274651}.transcript{font-size:17px;line-height:1.65;min-height:100px;margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.stop-button{border:0;background:#dd4143;color:#fff;width:65px;height:65px;border-radius:50%;box-shadow:0 0 0 8px #fae6e7;display:grid;place-items:center;margin:26px auto 10px}.stop-button svg{width:29px;height:29px}.status-text{font-size:16px;font-weight:800}.small-hint{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0;text-align:center}.listen-layout{padding:25px 21px 19px;display:flex;flex-direction:column;align-items:center}.listen-layout .avatar{width:111px;height:111px;margin:15px 0 13px}.listen-layout .avatar svg{width:63px;height:63px}.chat{padding:18px 16px 26px;display:flex;flex-direction:column;gap:15px}.bubble{border-radius:17px;padding:14px;line-height:1.65;font-size:15px;box-shadow:0 3px 8px rgba(25,84,89,.06);overflow-wrap:anywhere}.bubble.user{background:#e4f6f8}.bubble.ai{background:#fff;border:1px solid #dae8eb}.bubble-head{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;margin-bottom:9px}.bubble-head span:last-child{font-size:11px;color:var(--teal);font-weight:650}.bubble-avatar{width:28px;height:28px;border-radius:50%;background:#168a92;color:white;display:grid;place-items:center}.bubble-avatar.user-avatar{background:#b5e7e9;color:#126e75}.bubble-text{padding-left:33px;white-space:pre-wrap}.divider{height:1px;background:#e7eff0;margin:12px 0}.speak-again{width:100%;border:0;background:transparent;padding:7px;color:#1c3a48;font-weight:700;display:flex;justify-content:center;gap:8px;align-items:center}.actions{display:flex;flex-direction:column;gap:10px;padding-top:4px}.primary,.secondary{border-radius:14px;min-height:50px;font-size:15px;font-weight:750;padding:10px 14px}.primary{border:1px solid #087783;background:linear-gradient(#0b8d94,#05747f);color:white}.secondary{background:white;border:1.5px solid #b9d5de;color:#253944}.secondary:disabled{opacity:.5}.inline-form{background:#f7fcfc;border:1px solid #d8e9eb;padding:11px;border-radius:16px;display:flex;gap:8px;align-items:center}.inline-form textarea{border:1px solid #c6dfe3;min-height:50px;max-height:140px;resize:vertical;border-radius:9px;background:white;padding:10px;flex:1;min-width:0}.inline-form button{border:0;border-radius:11px;background:#087e87;color:white;padding:12px;min-height:45px}.compose{padding:12px 15px;background:#fff;border-top:1px solid #e8f1f2;display:flex;gap:9px;align-items:end}.compose textarea{flex:1;min-width:0;border:1.5px solid #cde4e8;background:#f9fcfd;border-radius:14px;padding:10px 12px;resize:none;min-height:44px;max-height:100px;font-size:14px}.compose .send{border:0;background:var(--teal);color:#fff;border-radius:13px;width:44px;height:44px;display:grid;place-items:center;flex-shrink:0}.compose .voice-mini{border:1px solid #cbe6e9;background:#eefafb;color:#087d86;border-radius:13px;width:44px;height:44px;display:grid;place-items:center;flex-shrink:0}.settings{padding:22px 19px}.settings h2{font-size:20px;margin:2px 0 15px}.settings label{display:block;font-weight:700;font-size:14px;margin:18px 0 7px}.settings input[type=url],.settings select{width:100%;padding:12px;border:1px solid #cadfe3;border-radius:12px;background:#fff}.settings .note{font-size:13px;line-height:1.65;color:#5d767d}.settings .primary{width:100%;margin-top:20px}.settings .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #e6eeee}.toggle-row input{width:20px;height:20px;accent-color:var(--teal)}.toast{position:absolute;z-index:16;bottom:20px;left:16px;right:16px;background:#153e45;color:#fff;border-radius:13px;padding:13px;font-size:13px;box-shadow:var(--shadow);text-align:center}.hide{display:none!important}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.empty{color:#79919a;font-size:14px;text-align:center;padding:24px}.service-card{background:#f5fbfc;border:1px solid #d7e9ec;border-radius:15px;padding:15px;line-height:1.6}.service-card b{color:#0d7480}.service-card p{font-size:13px;color:#56717b}.service-card a{display:inline-block;color:#087e86;font-weight:700;margin-top:5px}.back-link{background:none;border:0;color:#087e86;padding:6px 0;font-weight:700}.chat-meta{font-size:12px;color:#718b93;text-align:center}.warning{background:#fff8ed;border:1px solid #f2dbb3;border-radius:10px;color:#705025;font-size:12px;padding:9px;line-height:1.5}.accessory{display:flex;gap:8px;align-items:center;color:#417882;font-size:12px}.accessory .dot{width:7px;height:7px;background:#4eb1b9;border-radius:50%}@media(max-width:420px){.home-surface{padding-left:19px;padding-right:19px}.mic-button{width:min(43vw,170px);height:min(43vw,170px)}.mic-button svg{width:42%;height:42%}}@media(max-height:700px){.hero{height:125px;padding-top:24px}.home-surface{padding-top:8px}.mic-button{height:140px;width:140px;margin:5px auto}.examples{padding-top:10px}.chip-list{gap:5px}.chip{padding:6px 13px}.listen-layout{padding-top:12px}.listen-layout .avatar{width:83px;height:83px;margin:3px 0 7px}.listen-layout .avatar svg{width:49px;height:49px}.stop-button{margin:12px auto 5px}}

.shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  position: relative;
  overflow: hidden;
  background: #fff;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
    env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.topbar {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 15px;
  border-bottom: 1px solid #eef4f5;
  background: #fff;
}
.topbar .round-icon { width: 44px; height: 44px; flex-basis: 44px; }
.home-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid #cbe6e9;
  border-radius: 13px;
  background: #eaf7f9;
  color: #14333f;
  font-size: 15px;
  font-weight: 750;
}

button, .service-card a { touch-action: manipulation; }
.chip, .speak-again, .service-card a { min-height: 44px; }
.speak-again, .service-card a { border-radius: 10px; }
.service-card a { display: inline-flex; align-items: center; padding: 4px 8px; }
button:not(:disabled):active, .service-card a:active {
  background: var(--pressed-fill, #075661);
  color: #fff;
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .14);
}
.stop-button { --pressed-fill: #9d242c; }
.mic-button { --pressed-fill: #043d47; }
</style>
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 10.5v1a6.5 6.5 0 0 0 13 0v-1M12 18v4m-4 0h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol><symbol id="i-wave" viewBox="0 0 48 48"><path d="M7 20v8M14 12v24M21 18v12M28 7v34M35 17v14M42 21v6" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" fill="none"/></symbol><symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol><symbol id="i-gear" viewBox="0 0 24 24"><path d="M10 2h4l.6 2.2 2 .9 2.1-1.1 2.8 2.8-1.1 2.1.9 2L23 11v4l-2.2.6-.9 2 1.1 2.1-2.8 2.8-2.1-1.1-2 .9L14 23h-4l-.6-2.2-2-.9-2.1 1.1-2.8-2.8 1.1-2.1-.9-2L1 15v-4l2.2-.6.9-2L3 6.3l2.8-2.8 2.1 1.1 2-.9z" transform="translate(1 0) scale(.9)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.7 12 3l9 7.7v10.5h-7v-7H10v7H3z" fill="currentColor"/></symbol><symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-8 16-8 16 0"/></symbol><symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 8q5 4 0 8M19 5q8 7 0 14"/></symbol><symbol id="i-square" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol><symbol id="i-external" viewBox="0 0 24 24"><path d="M13 4h7v7M20 4l-9 9M19 14v6H4V5h6"/></symbol><symbol id="i-send" viewBox="0 0 24 24"><path d="m3 11 17-8-7 18-2-8-8-2z"/></symbol><symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="5"/><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"/></symbol><symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4.3 4.3l2.1 2.1m11.2 11.2 2.1 2.1M19.7 4.3l-2.1 2.1M6.4 17.6l-2.1 2.1"/></symbol></svg>
<div class="shell">
<header class="topbar">
  <button id="backHome" class="home-button" type="button">
    <svg width="18" height="18" aria-hidden="true"><use href="#i-home"/></svg>
    回到首頁
  </button>
  <button id="settingsBtn" class="round-icon" aria-label="設定"><svg width="23" height="23"><use href="#i-gear"/></svg></button>
</header>
<main id="main" class="main" aria-live="polite"></main>
<div id="compose" class="compose hide"><button id="miniMic" class="voice-mini" aria-label="語音輸入"><svg width="24" height="24"><use href="#i-mic"/></svg></button><label class="sr-only" for="messageInput">輸入訊息</label><textarea id="messageInput" rows="1" maxlength="1500" placeholder="輸入或說出您的需求…"></textarea><button id="sendBtn" class="send" aria-label="傳送訊息"><svg width="22" height="22"><use href="#i-send"/></svg></button></div>
<div id="toast" class="toast hide" role="status"></div>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),main=$('main'),compose=$('compose'),input=$('messageInput');
const symbols={mic:'i-mic',wave:'i-wave',square:'i-square',bot:'i-bot',volume:'i-volume',external:'i-external',sun:'i-sun'};
const icon=(id,size=20)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round" aria-hidden="true"><use href="#${id}"/></svg>`;
const data=[{id:'complaint_1999',name:'有話要說／1999陳情',description:'協助整理市政問題，確認內容後前往官方系統完成陳情。',url:'https://1999.gov.taipei/'},{id:'member',name:'臺北通會員服務',description:'會員登入、註冊與驗證方式的使用指引。',url:'https://id.taipei/'},{id:'cards',name:'數位卡證',description:'查詢臺北通數位卡證使用方式與入口。',url:'https://id.taipei/'},{id:'payment',name:'帳單及繳費',description:'說明臺北通提供的繳費功能與操作方式。',url:'https://id.taipei/'},{id:'coupon',name:'優惠及優惠券',description:'查詢臺北通優惠相關服務入口。',url:'https://id.taipei/'}];
let state={screen:'home',listening:false,session:'tp-'+Math.random().toString(36).slice(2,10),conversation:[],complaint:null,apiUrl:'',useAPI:false,autoSpeak:true,language:'zh-TW',recognition:null,originalScreen:'home'};let toastTimer;
function safe(text){return String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hide'),3400)}
function top(){compose.classList.toggle('hide',state.screen!=='chat');}
function render(){top();if(state.screen==='home')home();if(state.screen==='listening')listening();if(state.screen==='chat')chat();if(state.screen==='services')services();if(state.screen==='mine')mine();if(state.screen==='settings')settings();}
function home(){main.innerHTML=`<div class="hero"><div class="hero-content"><span class="avatar">${icon('i-sun',26)}</span>您好，想查什麼？</div></div><section class="home-surface"><button class="mic-button" id="bigMic" aria-label="按下開始語音輸入">${icon('i-mic',75)}</button><div class="home-title">按住說話</div><div class="home-sub">或直接說出你的需求</div><div class="examples"><div class="examples-title">你可以這樣說</div><div class="chip-list"><button class="chip" data-example="我要申訴道路問題">我要申訴道路問題</button><button class="chip" data-example="我要申請敬老卡">我要申請敬老卡</button><button class="chip" data-example="臺北通怎麼登入？">臺北通怎麼登入？</button></div><p class="tap-hint">點選麥克風開始；未支援語音時可改用文字</p></div></section>`;$('bigMic').onclick=startListening;document.querySelectorAll('[data-example]').forEach(x=>x.onclick=()=>send(x.dataset.example));}
function listening(){main.innerHTML=`<section class="listen-layout"><div class="avatar" style="color:#09828a;background:linear-gradient(#ddf6f7,#b8e6e9)">${icon('i-wave',55)}</div><div class="status-text">正在聆聽...</div><div class="status-panel"><div class="status-label">語音輸入（即時轉文字）</div><div id="liveTranscript" class="transcript" aria-live="polite">請開始說話...</div></div><button class="stop-button" id="stopMic" aria-label="停止錄音">${icon('i-square',30)}</button><div class="status-label">點擊停止</div><p class="small-hint">語音辨識結果會同步顯示；辨識不正確可再修改文字</p><button class="secondary" id="cancelListen" style="margin-top:10px;width:100%">取消並返回</button></section>`;$('stopMic').onclick=stopListening;$('cancelListen').onclick=()=>{cancelRecognition();state.screen=state.originalScreen;render()};}
function startListening(){state.originalScreen=state.screen;state.screen='listening';state.listening=true;render();const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){toast('此瀏覽器不支援語音辨識，請改用文字輸入');cancelRecognition();state.screen='chat';render();input.focus();return}try{let rec=new Speech();state.recognition=rec;rec.lang=state.language;rec.continuous=true;rec.interimResults=true;let finalText='';rec.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t;else interim+=t}state.transcript=(finalText+interim).trim();const el=$('liveTranscript');if(el)el.textContent=state.transcript||'請開始說話...'};rec.onerror=e=>{toast('無法辨識語音：'+e.error+'。可以改為文字輸入');if(state.listening)stopListening()};rec.onend=()=>{if(state.listening)stopListening()};rec.start()}catch(e){toast('無法啟動麥克風，請確認瀏覽器權限');state.screen='chat';state.listening=false;render();input.focus()}}
function cancelRecognition(){state.listening=false;state.transcript='';const r=state.recognition;state.recognition=null;if(r){r.onresult=null;r.onend=null;r.onerror=null;try{r.stop()}catch(e){}}}
function stopListening(){if(!state.listening)return;let text=(state.transcript||'').trim();cancelRecognition();if(text){send(text)}else{state.screen='chat';render();toast('沒有偵測到文字，請點麥克風重試或手動輸入')}}
function bubble(entry,index){const user=entry.role==='user',head=user?'你（語音轉文字）':'臺北通 助理';let buttons='';if(!user){buttons=`<div class="divider"></div><button class="speak-again" data-speak="${index}">${icon('i-volume',19)} 播放回覆</button>`}return `<div class="bubble ${user?'user':'ai'}"><div class="bubble-head"><span class="bubble-avatar ${user?'user-avatar':''}">${icon(user?'i-user':'i-bot',19)}</span>${head}</div><div class="bubble-text">${safe(entry.text)}</div>${entry.url&&/^https:\/\//.test(entry.url)?`<div class="actions"><button class="primary" data-open="${index}">${icon('i-external',17)} ${entry.cta||'前往官方服務'}</button>${entry.edit?'<button class="secondary" id="editDraft">修改內容</button>':''}</div>`:''}${buttons}</div>`}
function chat(){let messages=state.conversation.map(bubble).join('');main.innerHTML=`<div class="chat"><div class="chat-meta">以臺北通既有功能為服務範圍</div>${messages||'<div class="empty">您可以直接說出需求，或在下方輸入文字。</div>'}${state.complaint&&state.complaint.stage==='location'?'<div class="warning">請補充地點；尚未送出任何正式陳情。</div>':''}</div>`;main.querySelectorAll('[data-speak]').forEach(btn=>btn.onclick=()=>speak(state.conversation[+btn.dataset.speak].text));main.querySelectorAll('[data-open]').forEach(btn=>btn.onclick=()=>{let e=state.conversation[+btn.dataset.open];window.open(e.url,'_blank','noopener,noreferrer')});const edit=$('editDraft');if(edit)edit.onclick=()=>{state.complaint={stage:'detail',location:state.complaint?.location||'',description:state.complaint?.description||''};addAI('請說出需要修改的陳情內容，或直接在下方輸入。')};main.scrollTop=main.scrollHeight;}
function addAI(text,extra={}){state.conversation.push({role:'ai',text,...extra});if(state.screen!=='chat')return;render();if(state.autoSpeak)speak(text)}
function speak(text){if(!('speechSynthesis'in window)){toast('此裝置不支援語音朗讀');return}try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=state.language;u.rate=.92;u.pitch=1;let voices=speechSynthesis.getVoices();let match=voices.find(v=>v.lang.toLowerCase()===state.language.toLowerCase())||voices.find(v=>v.lang.startsWith('zh'));if(match)u.voice=match;speechSynthesis.speak(u)}catch(e){toast('無法播放語音，請查看文字回覆')}}
async function send(text){text=String(text||'').trim();if(!text)return;cancelRecognition();state.conversation.push({role:'user',text});state.screen='chat';input.value='';render();if(state.useAPI&&state.apiUrl){try{const response=await fetch(state.apiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session_id:state.session,language:state.language})});if(!response.ok)throw Error('HTTP '+response.status);const result=await response.json();let s=result.service||{},url=(s.url||result.official_url||'');addAI(result.answer||'已收到您的問題。',{url:/^https:\/\//.test(url)?url:'',cta:'前往官方服務'});return}catch(err){toast('後端連線失敗，已切換為本機示範：'+err.message)}}demo(text)}
function demo(text){let c=state.complaint;if(c?.stage==='location'){c.location=text;c.stage='confirm';addAI(`好的，我已整理好陳情內容：\n\n問題類型：道路設施／人行道問題\n地點：${text}\n陳情描述：${c.description}\n\n請確認內容是否正確。正式陳情仍需前往臺北市1999官方系統完成送件。`,{url:'https://1999.gov.taipei/',cta:'前往 1999 陳情',edit:true});return}if(c?.stage==='detail'){c.description=text;c.stage='confirm';addAI(`已更新陳情內容：\n\n地點：${c.location}\n陳情描述：${text}\n\n請確認後前往官方系統完成送件。`,{url:'https://1999.gov.taipei/',cta:'前往 1999 陳情',edit:true});return}
if(/申訴|陳情|投訴|人行道|道路破損|路燈|違停|行道樹/.test(text)){state.complaint={stage:'location',description:text};addAI('我可以協助您向市府提出陳情，請確認以下資訊：\n\n• 問題類型：道路設施或市政問題\n• 地點：請問是哪一條路？\n• 其他補充：例如破損範圍或影響情況。\n\n請先告訴我發生的地點。');return}
let match=/敬老卡|愛心卡|卡證/.test(text)?data[2]:/登入|註冊|會員|帳號/.test(text)?data[1]:/帳單|繳費|付款/.test(text)?data[3]:/優惠|優惠券/.test(text)?data[4]:null;if(match){addAI(`${match.description}\n\n這是臺北通既有功能的使用指引；如需操作，請前往官方入口。`,{url:match.url,cta:'前往官方入口'});return}addAI('抱歉，目前我只支援已收錄的臺北通功能，例如「有話要說／1999陳情」、「會員服務」、「數位卡證」、「帳單繳費」及「優惠」。您可以換一種說法再試一次。')}
function services(){main.innerHTML=`<div class="settings"><h2>臺北通服務</h2><p class="note">以下是目前已收錄的功能指引。正式功能及操作方式以官方最新資訊為準。</p><div style="display:grid;gap:12px">${data.map(s=>`<article class="service-card"><b>${safe(s.name)}</b><p>${safe(s.description)}</p><a href="${s.url}" target="_blank" rel="noopener noreferrer">查看官方服務 ↗</a></article>`).join('')}</div></div>`}
function mine(){main.innerHTML=`<div class="settings"><h2>我的</h2><div class="service-card"><b>語音助理示範模式</b><p>本原型不連接個人臺北通帳號、不讀取會員或卡證資料，也不會自動送出陳情。</p></div><button class="secondary" id="resetChat" style="width:100%;margin-top:18px">開始新對話</button></div>`;$('resetChat').onclick=()=>{state.conversation=[];state.complaint=null;state.session='tp-'+Math.random().toString(36).slice(2,10);state.screen='home';render();toast('已開始新對話')}}
function settings(){main.innerHTML=`<div class="settings"><h2>語音助理設定</h2><label for="apiUrl">後端 API 網址</label><input id="apiUrl" type="url" placeholder="http://localhost:8080/api/ask" value="${safe(state.apiUrl)}"><div class="toggle-row"><label for="useAPI">啟用後端查詢</label><input id="useAPI" type="checkbox" ${state.useAPI?'checked':''}></div><div class="toggle-row"><label for="autoSpeak">自動朗讀系統回答</label><input id="autoSpeak" type="checkbox" ${state.autoSpeak?'checked':''}></div><label for="lang">語音語言</label><select id="lang"><option value="zh-TW">國語（臺灣）</option><option value="en-US">English</option></select><p class="note">此設定適用於語音輸入和朗讀。查詢回覆以中文提供。</p><button id="saveSettings" class="primary">儲存設定</button></div>`;$('lang').value=state.language;$('saveSettings').onclick=()=>{let url=$('apiUrl').value.trim();if(url&&!/^https?:\/\//i.test(url)){toast('請輸入完整的 http 或 https 網址');return}state.apiUrl=url;state.useAPI=$('useAPI').checked;state.autoSpeak=$('autoSpeak').checked;state.language=$('lang').value;state.screen='home';render();toast('設定已儲存（本次開啟期間）')}}
async function goHome(){
  cancelRecognition();
  window.speechSynthesis?.cancel();
  try {
    const bridge = window.flutter_inappwebview;
    if (bridge?.callHandler && await bridge.callHandler('townPassReturnHome') === true) return;
  } catch {
    // Keep the web interface usable without the native handler.
  }
  state.screen='home';
  render();
  main.scrollTop=0;
}

$('settingsBtn').onclick=()=>{cancelRecognition();state.screen='settings';render()};$('backHome').onclick=goHome;$('sendBtn').onclick=()=>send(input.value);$('miniMic').onclick=startListening;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(input.value)}});render();
})();
</script>
</body></html>
