<style>

shadow:0 0 0 6px #ecfafb,0 0 0 9px rgba(6,143,152,.09)}50%{box-shadow:0 0 0 8px #ddf4f5,0 0 0 18px rgba(6,143,152,.14)}}.home-title{font-size:23px;font-weight:850;margin:2px 0 4px}.home-sub{font-size:15px;color:#4b6670;text-align:center}.examples{margin-top:auto;width:100%;padding-top:24px}.examples-title{font-size:14px;font-weight:800;margin-bottom:10px}.chip-list{display:flex;flex-direction:column;align-items:center;gap:9px}.chip{border:1px solid #d6e9ed;border-radius:20px;background:#eaf6f8;padding:8px 18px;font-size:14px;color:#263d48;min-width:175px;box-shadow:0 2px 3px #edf4f5}.tap-hint{font-size:12px;color:#7a9198;text-align:center;margin-top:15px}.status-panel{width:100%;padding:12px 15px;border:1.5px solid #b9d8df;border-radius:17px;background:#f5fbfc;margin-top:21px}.status-label{font-size:12px;font-weight:800;color:#274651}.transcript{font-size:17px;line-height:1.65;min-height:100px;margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.stop-button{border:0;background:#dd4143;color:#fff;width:65px;height:65px;border-radius:50%;box-shadow:0 0 0 8px #fae6e7;display:grid;place-items:center;margin:26px auto 10px}.stop-button svg{width:29px;height:29px}.status-text{font-size:16px;font-weight:800}.small-hint{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0;text-align:center}.listen-layout{padding:25px 21px 19px;display:flex;flex-direction:column;align-items:center}

/* Listening screen: reuse the home page’s wave header and oversized microphone. */
.listen-hero{height:190px;min-height:190px;display:block;padding:24px 27px 25px}
.listen-hero .hero-content{font-size:19px}
.listen-hero .live-heading{position:relative;z-index:1;display:flex;align-items:center;gap:8px;margin-top:5px;font-weight:800;font-size:16px;color:#086f78}
.listen-hero .live-heading .live-dot{height:9px;width:9px;border-radius:50%;background:#eb5555;box-shadow:0 0 0 4px #fce6e6;flex:none}
.listen-hero .transcript{position:relative;z-index:1;min-height:0;max-height:82px;overflow-y:auto;margin:7px 0 0;font-size:17px;line-height:1.45;font-weight:600;color:#203c45}
.listen-hero .transcript.placeholder{color:#6d8990;font-weight:400}
.listen-hero .transcript-count{position:relative;z-index:1;text-align:right;font-size:11px;color:#5f858c;margin-top:3px}
.listen-surface{min-height:calc(100% - 171px);gap:0;padding-top:24px}
.listen-surface .mic-button{margin:12px auto 18px}
.listen-surface .home-title{margin:3px 0 5px}
.listen-surface .home-sub{max-width:370px}
.listen-surface .listen-bottom{width:100%;margin-top:auto;padding-top:30px;display:flex;flex-direction:column;align-items:center;gap:12px}
.listen-surface .cancel-button{width:min(100%,430px);min-height:78px;padding:16px 24px;border:1.5px solid #b9dce2;border-radius:21px;background:#eaf6f8;color:#153b48;font-size:21px;font-weight:800;box-shadow:0 3px 9px rgba(16,92,102,.06)}
.listen-surface .cancel-button:active{background:#d9eef1}
@media(max-width:420px){.listen-hero{padding-left:22px;padding-right:22px}.listen-hero .hero-content{font-size:18px}.listen-surface .mic-button{width:min(48vw,185px);height:min(48vw,185px)}}
@media(max-height:700px){.listen-hero{height:170px;min-height:170px;padding-top:17px}.listen-hero .live-heading{margin-top:6px}.listen-hero .transcript{max-height:66px}.listen-surface{min-height:calc(100% - 151px);padding-top:10px}.listen-surface .mic-button{width:min(40vw,150px);height:min(40vw,150px);margin:9px auto 10px}.listen-surface .listen-bottom{padding-top:12px;gap:5px}.listen-surface .cancel-button{min-height:66px}}
.listen-layout .avatar{width:111px;height:111px;margin:15px 0 13px}.listen-layout .avatar svg{width:63px;height:63px}.chat{padding:18px 16px 26px;display:flex;flex-direction:column;gap:15px}.bubble{border-radius:17px;padding:14px;line-height:1.65;font-size:15px;box-shadow:0 3px 8px rgba(25,84,89,.06);overflow-wrap:anywhere}.bubble.user{background:#e4f6f8}.bubble.ai{background:#fff;border:1px solid #dae8eb}.bubble-head{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;margin-bottom:9px}.bubble-head span:last-child{font-size:11px;color:var(--teal);font-weight:650}.bubble-avatar{width:28px;height:28px;border-radius:50%;background:#168a92;color:white;display:grid;place-items:center}.bubble-avatar.user-avatar{background:#b5e7e9;color:#126e75}.bubble-text{padding-left:33px;white-space:pre-wrap}.divider{height:1px;background:#e7eff0;margin:12px 0}.speak-again{width:100%;border:0;background:transparent;padding:7px;color:#1c3a48;font-weight:700;display:flex;justify-content:center;gap:8px;align-items:center}.actions{display:flex;flex-direction:column;gap:10px;padding-top:4px}.primary,.secondary{border-radius:14px;min-height:50px;font-size:15px;font-weight:750;padding:10px 14px}.primary{border:1px solid #087783;background:linear-gradient(#0b8d94,#05747f);color:white}.secondary{background:white;border:1.5px solid #b9d5de;color:#253944}.secondary:disabled{opacity:.5}.inline-form{background:#f7fcfc;border:1px solid #d8e9eb;padding:11px;border-radius:16px;display:flex;gap:8px;align-items:center}.inline-form textarea{border:1px solid #c6dfe3;min-height:50px;max-height:140px;resize:vertical;border-radius:9px;background:white;padding:10px;flex:1;min-width:0}.inline-form button{border:0;border-radius:11px;background:#087e87;color:white;padding:12px;min-height:45px}.compose{padding:12px 15px;background:#fff;border-top:1px solid #e8f1f2;display:flex;gap:9px;align-items:end}.compose textarea{flex:1;min-width:0;border:1.5px solid #cde4e8;background:#f9fcfd;border-radius:14px;padding:10px 12px;resize:none;min-height:44px;max-height:100px;font-size:14px}.compose .send{border:0;background:var(--teal);color:#fff;border-radius:13px;width:44px;height:44px;display:grid;place-items:center;flex-shrink:0}.compose .voice-mini{border:1px solid #cbe6e9;background:#eefafb;color:#087d86;border-radius:13px;width:44px;height:44px;display:grid;place-items:center;flex-shrink:0}.settings{padding:22px 19px}.settings h2{font-size:20px;margin:2px 0 15px}.settings label{display:block;font-weight:700;font-size:14px;margin:18px 0 7px}.settings input[type=url],.settings select{width:100%;padding:12px;border:1px solid #cadfe3;border-radius:12px;background:#fff}.settings .note{font-size:13px;line-height:1.65;color:#5d767d}.settings .primary{width:100%;margin-top:20px}.settings .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid #e6eeee}.toggle-row input{width:20px;height:20px;accent-color:var(--teal)}.toast{position:absolute;z-index:16;bottom:20px;left:16px;right:16px;background:#153e45;color:#fff;border-radius:13px;padding:13px;font-size:13px;box-shadow:var(--shadow);text-align:center}.hide{display:none!important}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.empty{color:#79919a;font-size:14px;text-align:center;padding:24px}.service-card{background:#f5fbfc;border:1px solid #d7e9ec;border-radius:15px;padding:15px;line-height:1.6}.service-card b{color:#0d7480}.service-card p{font-size:13px;color:#56717b}.service-card a{display:inline-block;color:#087e86;font-weight:700;margin-top:5px}.back-link{background:none;border:0;color:#087e86;padding:6px 0;font-weight:700}.chat-meta{font-size:12px;color:#718b93;text-align:center}.warning{background:#fff8ed;border:1px solid #f2dbb3;border-radius:10px;color:#705025;font-size:12px;padding:9px;line-height:1.5}.accessory{display:flex;gap:8px;align-items:center;color:#417882;font-size:12px}.accessory .dot{width:7px;height:7px;background:#4eb1b9;border-radius:50%}@media(max-width:420px){.home-surface{padding-left:19px;padding-right:19px}.mic-button{width:min(43vw,170px);height:min(43vw,170px)}.mic-button svg{width:42%;height:42%}}@media(max-height:700px){.hero{height:125px;padding-top:24px}.home-surface{padding-top:8px}.mic-button{height:140px;width:140px;margin:5px auto}.examples{padding-top:10px}.chip-list{gap:5px}.chip{padding:6px 13px}.listen-layout{padding-top:12px}.listen-layout .avatar{width:83px;height:83px;margin:3px 0 7px}.listen-layout .avatar svg{width:49px;height:49px}.stop-button{margin:12px auto 5px}}

.shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  position: relative;
  overflow: hidden;
  background: #fff;
  /* 頂部不留安全區域：TownPass 標題列已處理狀態列，WebView 仍回報其高度會造成空白 */
  padding: 0 env(safe-area-inset-right, 0px)
    env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.topbar {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  padding: 8px 15px;
  border-bottom: 1px solid #eef4f5;
  background: #fff;
}
.topbar .round-icon { width: 44px; height: 44px; flex-basis: 44px; }
.home-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid #cbe6e9;
  border-radius: 13px;
  background: #eaf7f9;
  color: #14333f;
  font-size: 15px;
  font-weight: 750;
}

button, .service-card a { touch-action: manipulation; }
.chip, .speak-again, .service-card a { min-height: 44px; }
.speak-again, .service-card a { border-radius: 10px; }
.service-card a { display: inline-flex; align-items: center; padding: 4px 8px; }
button:not(:disabled):active, .service-card a:active {
  background: var(--pressed-fill, #075661);
  color: #fff;
  box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .14);
}
.stop-button { --pressed-fill: #9d242c; }
.mic-button { --pressed-fill: #043d47; }

/* V2：錄音音量驅動圓形大小；降級時維持原本的呼吸動畫 */
.mic-button.audio-reactive{transform:scale(var(--sound-scale,1));box-shadow:0 0 0 6px #e3f5f7,0 0 0 var(--sound-halo,13px) rgba(11,147,158,.19),0 8px 21px rgba(12,94,110,.16);animation:none;will-change:transform,box-shadow;transition:transform .075s linear,box-shadow .075s linear;}
@media(prefers-reduced-motion:reduce){.mic-button.audio-reactive{transition:none}}
/* 說話時的波紋：兩圈外環隨音量（--level 0–1）放大、變明顯，像通話／錄音時的音量波動 */
.mic-wrap{position:relative;display:grid;place-items:center;--level:0;margin:16px auto 20px}
.listen-surface .mic-wrap .mic-button{position:relative;z-index:1;margin:0}
.mic-wrap .ripple{position:absolute;inset:0;margin:auto;width:100%;height:100%;border-radius:50%;pointer-events:none;border:3px solid rgba(11,147,158,.55);transition:transform .12s ease-out,opacity .12s ease-out}
.mic-wrap .r1{transform:scale(calc(1.08 + var(--level)*.45));opacity:calc(.15 + var(--level)*.75)}
.mic-wrap .r2{transform:scale(calc(1.16 + var(--level)*.85));opacity:calc(.08 + var(--level)*.5);border-width:2px}
@media(prefers-reduced-motion:reduce){.mic-wrap .ripple{transition:none}}
/* ── 版面：麥克風固定在畫面下方 ──
   main 改為直向 flex，首頁／聆聽頁的白色區塊撐滿剩餘高度，
   .mic-dock 用 margin-top:auto 貼齊底部，兩個畫面的麥克風大小、位置一致 */
.main{display:flex;flex-direction:column}
.main>*{flex-shrink:0}
.main>.home-surface{flex:1 0 auto;min-height:0}
.home-surface .examples{margin-top:0;padding-top:6px}
.listen-surface .listen-bottom{margin-top:0;padding-top:4px}
.mic-dock{margin-top:auto;width:100%;display:flex;flex-direction:column;align-items:center;padding:22px 0 calc(10px + env(safe-area-inset-bottom))}
.mic-dock .mic-button,.listen-surface .mic-dock .mic-button{width:150px;height:150px;margin:0}
.mic-dock .mic-wrap{margin:0}
/* 音量波紋不要蓋住下方「點擊停止」文字：文字疊在波紋上方，外圈波紋縮小 */
.mic-dock .home-title,.mic-dock .home-sub{position:relative;z-index:2}
.mic-dock .mic-wrap .r2{transform:scale(calc(1.12 + var(--level)*.45))}
.mic-dock .home-title,.listen-surface .mic-dock .home-title{margin:0 0 2px}
/* 麥克風下方固定高度：首頁／聆聽頁放說明文字，對話頁放文字輸入，三個畫面麥克風位置因此一致 */
.dock-below{height:92px;padding-top:14px;width:100%;display:flex;flex-direction:column;align-items:center;box-sizing:border-box}
/* 對話頁底部 dock：與 .mic-dock 相同的上下留白與按鈕大小 */
#compose.chat-dock{flex-direction:column;align-items:center;gap:0;padding:22px 15px calc(34px + env(safe-area-inset-bottom));border-top:1px solid #e8f1f2}
#compose.chat-dock .mic-button{width:150px;height:150px;margin:0}
#compose.chat-dock .compose-row{flex-direction:row;align-items:flex-start;gap:9px;max-width:520px}
#compose.chat-dock textarea{height:52px;min-height:52px;max-height:52px}
#compose.chat-dock .send{width:52px;height:52px}
/* ── 整體字級放大（手部不便、長者閱讀） ── */
.hero-content,.listen-hero .hero-content{font-size:22px}
.home-title{font-size:27px}
.home-sub{font-size:18px}
.examples-title{font-size:18px}
.chip{font-size:18px;padding:10px 20px}
.tap-hint,.small-hint{font-size:15px}
.listen-hero .live-heading{font-size:18px}
.transcript,.listen-hero .transcript{font-size:20px}
.listen-hero .transcript-count{font-size:13px}
.chat-meta{font-size:15px}
.bubble-head{font-size:16px}
.bubble-text{font-size:20px}
.primary,.secondary,.speak-again{font-size:18px}
.compose textarea{font-size:18px}
.settings h2{font-size:24px}
.settings label{font-size:17px}
.settings .note,.service-card p{font-size:16px}
.service-card b{font-size:18px}
.toast{font-size:16px}
.warning{font-size:15px}
/* 回答泡泡底部的資料來源小字 */
.source-line{font-size:15px;color:#6b858d;text-align:right;margin-top:6px}
/* 設定頁「關於與技術揭露」 */
.about{margin-top:26px;padding-top:16px;border-top:1px solid #e1ecee}.about h3{font-size:16px;margin:0 0 8px}.about ul{margin:0;padding-left:18px;font-size:16px;line-height:1.7;color:#4d6870}
</style>
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 10.5v1a6.5 6.5 0 0 0 13 0v-1M12 18v4m-4 0h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol><symbol id="i-wave" viewBox="0 0 48 48"><path d="M7 20v8M14 12v24M21 18v12M28 7v34M35 17v14M42 21v6" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" fill="none"/></symbol><symbol id="i-back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol><symbol id="i-gear" viewBox="0 0 24 24"><path d="M10 2h4l.6 2.2 2 .9 2.1-1.1 2.8 2.8-1.1 2.1.9 2L23 11v4l-2.2.6-.9 2 1.1 2.1-2.8 2.8-2.1-1.1-2 .9L14 23h-4l-.6-2.2-2-.9-2.1 1.1-2.8-2.8 1.1-2.1-.9-2L1 15v-4l2.2-.6.9-2L3 6.3l2.8-2.8 2.1 1.1 2-.9z" transform="translate(1 0) scale(.9)" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol><symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.7 12 3l9 7.7v10.5h-7v-7H10v7H3z" fill="currentColor"/></symbol><symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-8 16-8 16 0"/></symbol><symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 8q5 4 0 8M19 5q8 7 0 14"/></symbol><symbol id="i-square" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol><symbol id="i-external" viewBox="0 0 24 24"><path d="M13 4h7v7M20 4l-9 9M19 14v6H4V5h6"/></symbol><symbol id="i-send" viewBox="0 0 24 24"><path d="m3 11 17-8-7 18-2-8-8-2z"/></symbol><symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="5"/><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"/></symbol><symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4.3 4.3l2.1 2.1m11.2 11.2 2.1 2.1M19.7 4.3l-2.1 2.1M6.4 17.6l-2.1 2.1"/></symbol></svg>
<div class="shell">
<header class="topbar">
  <!-- 「回到首頁」：回語音助理首頁（不是台北通首頁；離開助理用 App 標題列右上角的 X）。在首頁時隱藏 -->
  <button id="backHome" class="home-button hide" type="button" style="margin-right:auto">
    <svg width="18" height="18" aria-hidden="true"><use href="#i-home"/></svg>
    <span id="backHomeText">回到首頁</span>
  </button>
  <button id="settingsBtn" class="round-icon" aria-label="設定"><svg width="23" height="23"><use href="#i-gear"/></svg></button>
</header>
<main id="main" class="main" aria-live="polite"></main>
<!-- 對話頁底部：大麥克風與首頁、聆聽頁同一個位置；麥克風下方（首頁放「點一下說話」的高度）放文字輸入 -->
<div id="compose" class="compose chat-dock hide"><button id="miniMic" class="mic-button" aria-label="語音輸入"><svg width="75" height="75"><use href="#i-mic"/></svg></button><div class="dock-below compose-row"><label class="sr-only" for="messageInput">輸入訊息</label><textarea id="messageInput" rows="1" maxlength="1500" placeholder="在這裡輸入問題，按右側送出鍵查詢"></textarea><button id="sendBtn" class="send" aria-label="傳送訊息"><svg width="22" height="22"><use href="#i-send"/></svg></button></div></div>
<div id="toast" class="toast hide" role="status"></div>
</div>
<script src="townpass-assistant/voice-gemma-55/src/gemma-parser.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),main=$('main'),compose=$('compose'),input=$('messageInput');
const symbols={mic:'i-mic',wave:'i-wave',square:'i-square',bot:'i-bot',volume:'i-volume',external:'i-external',sun:'i-sun'};
const icon=(id,size=20)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round" aria-hidden="true"><use href="#${id}"/></svg>`;
const data=[{id:'complaint_1999',name:'有話要說／1999陳情',description:'協助整理市政問題，確認內容後前往官方系統完成陳情。',url:'https://1999.gov.taipei/'},{id:'member',name:'臺北通會員服務',description:'會員登入、註冊與驗證方式的使用指引。',url:'https://id.taipei/'},{id:'cards',name:'數位卡證',description:'查詢臺北通數位卡證使用方式與入口。',url:'https://id.taipei/'},{id:'payment',name:'帳單及繳費',description:'說明臺北通提供的繳費功能與操作方式。',url:'https://id.taipei/'},{id:'coupon',name:'優惠及優惠券',description:'查詢臺北通優惠相關服務入口。',url:'https://id.taipei/'}];
let state={screen:'home',listening:false,session:'tp-'+Math.random().toString(36).slice(2,10),conversation:[],complaint:null,apiUrl:'http://localhost:8080/api/v1/query',useAPI:false,autoSpeak:true,language:'zh-TW',recognition:null,originalScreen:'home',transcript:'',recognitionBase:'',recognitionFinal:'',recognitionInterim:'',stopRequested:false,restartTimer:null,audioStream:null,audioCtx:null,audioFrame:null,audioAnalyser:null,apiContext:null,apiBusy:false};let toastTimer;
// 由後端（Spring Boot）提供頁面時，直接使用同源的 /api/v1/query；用檔案開啟時維持本機示範。
if(/^https?:$/.test(location.protocol)){state.apiUrl=location.origin+'/api/v1/query';state.useAPI=true;}
// 臺北通 App 內：Android WebView 不支援 SpeechRecognition，語音改走 TownPass 原生 voice Handler。
// 協定見 device-bridge/README.md；一般瀏覽器沒有 flutterObject，仍使用瀏覽器語音。
const tp=window.flutterObject;
const tpSend=(action,extra={})=>tp.postMessage(JSON.stringify({name:'voice',data:{action,...extra}}));
if(tp)tp.addEventListener('message',ev=>{let m;try{m=typeof ev.data==='string'?JSON.parse(ev.data):ev.data}catch(e){return}if(m&&m.name==='voice'&&m.data)onNativeVoice(m.data)});
function onNativeVoice(d){
  switch(d.event){
    case 'speechResult':
      if(!state.listening)return;
      state.transcript=String(d.text||'').trim();displayTranscript();
      if(d.isFinal)finishListening();
      break;
    case 'soundLevel':if(state.listening)setMicLevel(Number(d.level)||0);break;
    case 'speechError':
      // 原生端訊息是中文；英文介面時改用英文說明
      if(!state.listening){if(/^tts|invalid_text/.test(d.code||''))toast(isEn()?'Could not read the reply aloud. Please read the text on screen.':(d.message||'無法播放語音，請查看文字回覆'));return;}
      {const draft=state.transcript;cancelRecognition();state.screen='chat';render();input.value=draft;
        toast(isEn()?(d.code==='permission_denied'?'Microphone permission is off. Please allow it in Settings.':"I didn't catch that. Tap the microphone and try again, or type your question."):(d.message||'語音辨識發生問題，請改用文字輸入'));}
      break;
    case 'voiceStatus':{const msg=isEn()?(d.engine==='whisper'?'Using on-device speech recognition. Please wait a few seconds after you finish.':'Recognizing…'):d.message;
      const sub=document.querySelector('.listen-surface .home-sub');if(sub)sub.textContent=msg;else toast(msg);break;}
    case 'speakingCompleted':
      if(state.awaitAnswer&&!state.listening&&state.screen==='chat'){state.awaitAnswer=false;startListening();}
      break;
    case 'speakingStopped':state.awaitAnswer=false;break;
    case 'listeningStopped':{const t=document.querySelector('.listen-surface .home-title');if(t&&state.listening)t.textContent=tr('辨識中…','Recognizing…');setMicLevel(0);break;}
  }
}
// 離線模式（設定頁）：語音辨識一律用裝置上的 Whisper，證明不依賴 Google；記在本機
try{state.offlineVoice=localStorage.getItem('offlineVoice')==='1'}catch(e){state.offlineVoice=false}
// 開發者模式：網址加 ?dev=1 才在設定頁顯示「後端 API 網址」「啟用後端查詢」
const DEV=/[?&]dev=1(&|$)/.test(location.search);// ── 英文：問題是英文（或語音語言選 English）就用英文回答 ──
// 服務說明的英文版是開發階段預先翻譯（service-en.json），不是執行時 AI 產生；
// 公車用官方資料的英文站名；其餘固定句。
let serviceEn=null;
fetch(location.origin+'/service-en.json').then(r=>r.ok?r.json():null).then(j=>{serviceEn=j}).catch(()=>{});
// 有中文時比較英文「單字數」與中文字數，避免「附近YouBike」這類中文句被當成英文
function isEnglishText(t){const latin=(t.match(/[A-Za-z]/g)||[]).length,words=(t.match(/[A-Za-z]+/g)||[]).length,cjk=(t.match(/[㐀-鿿]/g)||[]).length;return cjk===0?latin>=3:(words>=2&&words>cjk);}
function englishAnswer(r){
  const a=r.arrivals&&r.arrivals[0];
  if(a){const st={DUE:'arriving now',NOT_DEPARTED:'not departed yet',SKIPPED:'not stopping at this stop',LAST_PASSED:'the last bus has passed',NO_SERVICE:'no service today',NO_ESTIMATE:'no official estimate available'}[a.status];
    const eta=a.status==='ESTIMATED'&&a.estimateSeconds!=null?`about ${Math.max(1,Math.ceil(a.estimateSeconds/60))} minute${Math.ceil(a.estimateSeconds/60)>1?'s':''}`:(st||'no official estimate available');
    return `Bus ${a.route} at ${a.stopEn||a.stop}, toward ${a.destinationEn||a.destination}: ${eta}. Arrival times are estimates.`;}
  if(r.type==='CLARIFY'){
    if(r.choices&&r.choices.length)return 'There are several stops or directions. Please say where you are heading, or choose below.';
    if(r.context&&r.context.route&&!r.context.stop)return `Which stop for bus ${r.context.route}? Please say the stop name.`;
    if(r.context&&r.context.draft)return 'Please tell me the road name, address or a nearby landmark.';
    return 'Please tell me the bus route and the stop.';}
  if(r.type==='OUT_OF_SCOPE'){
    // 後端以「台北通目前沒有提供」開頭時，表示問到的是台北通沒有的服務（例如公車到站）
    const lead=/^台北通目前沒有提供/.test(r.speech||'')?"TaipeiPASS does not offer this service, so I can't answer it.":"I couldn't find a matching TaipeiPASS service. You can ask about accounts, cards, bills, offers, city services or places.";
    return lead+"\n\nIf you need help, tap below to call the 1999 citizen hotline.";}
  if(r.draft)return 'I have put your report together, but it has not been sent yet. Next, choose one: (1) tap "Open official service" to open the Taipei petition system, sign in as the page asks, and fill in the description and location below; or (2) call the 1999 citizen hotline and report it by phone.';
  if(r.type==='UPSTREAM_UNAVAILABLE')return 'Official bus data is not available right now. Please try again later or check the Taipei e-bus website.';
  if(r.type==='NO_RESULT')return 'No matching official data was found. Please check the route, stop or direction.';
  return (serviceEn&&r.service&&serviceEn[r.service.id])||r.speech;
}
function stopSpeak(){if(tp)tpSend('stopSpeaking');else window.speechSynthesis?.cancel();}

// ── 裝置端 LLM（Gemma 4 E4B，經 TownPass 原生 llm Handler）──
// Gemma 只負責「理解問題」：輸出服務 ID／路線／站牌，經 Jassline 的 gemma-parser.js 檢查後，
// 轉成後端一定認得的說法再查 /api/v1/query。答案一律來自後端官方資料，Gemma 不產生答案。
// Gemma 不可用、逾時或輸出不合法時，直接用原句查詢（規則式備援）。
const gemma={parser:null,services:null,pending:new Map(),seq:0,phrases:new Map(),available:null};
if(tp)tp.addEventListener('message',ev=>{let m;try{m=typeof ev.data==='string'?JSON.parse(ev.data):ev.data}catch(e){return}
  if(!m||m.name!=='llm'||!m.data)return;const d=m.data;
  if(d.event==='status')gemma.available=!!d.ready;
  // 模型載入後先用系統提示跑一次短句，讓服務清單的計算結果留在快取，之後每句只需處理使用者的話
  if(d.event==='loaded')gemmaWarmUp();
  if((d.event==='result'||d.event==='error')&&d.id!=null&&gemma.pending.has(d.id)){const p=gemma.pending.get(d.id);gemma.pending.delete(d.id);d.event==='result'?p.resolve(d):p.reject(Object.assign(Error(d.message||d.code),{code:d.code}));}
  if(d.event==='error'&&d.code==='model_missing')gemma.available=false;
});
// 開啟頁面時先查模型狀態並在背景載入，第一次提問就不用等載入
if(tp){tp.postMessage(JSON.stringify({name:'llm',data:{action:'status'}}));tp.postMessage(JSON.stringify({name:'llm',data:{action:'load'}}));}
// 預熱：說話時原生端會暫停 Gemma（code: yielded），等使用者閒下來再重試
function gemmaWarmUp(){
  gemmaReady().then(ok=>{if(!ok||gemma.warm)return;
    llmGenerate(gemmaPrompt(),'你好',600000).then(r=>{gemma.warm=true;console.log('[Gemma] warm-up',r.ms,'ms')})
      .catch(e=>{if(e.code==='yielded')setTimeout(retryWarmUp,15000)});
  });
}
function retryWarmUp(){if(state.listening||state.apiBusy){setTimeout(retryWarmUp,15000);return}gemmaWarmUp();}
// 逾時 60 秒：模擬器上第二次以後的推論實測約 37 秒，45 秒容易逾時（原生端同步採用此值並取消推論）
function llmGenerate(system,prompt,timeoutMs=60000){
  const id=++gemma.seq;
  return new Promise((resolve,reject)=>{
    gemma.pending.set(id,{resolve,reject});
    tp.postMessage(JSON.stringify({name:'llm',data:{action:'generate',id,system,prompt,maxTokens:96,timeoutMs,grammar:gemmaGrammar()}}));
    setTimeout(()=>{if(gemma.pending.delete(id))reject(Object.assign(Error('timeout'),{code:'timeout'}))},timeoutMs);
  });
}
async function gemmaReady(){
  // 預熱完成前不使用 Gemma：載入＋預熱要數分鐘，不能讓使用者乾等，直接用規則式結果（含 1999）
  if(!tp||!state.useAPI||!window.TownPassGemmaParser||gemma.available===false||(gemma.parser&&!gemma.warm))return false;
  if(!gemma.parser){
    const res=await fetch(location.origin+'/api/v1/services');if(!res.ok)return false;
    gemma.services=await res.json();gemma.parser=TownPassGemmaParser.createParser(gemma.services);
  }
  return true;
}
// 找出後端一定會對應到該服務的說法（標題或別名），結果快取
async function phraseFor(id){
  if(gemma.phrases.has(id))return gemma.phrases.get(id);
  const s=gemma.services.find(x=>x.id===id);if(!s)return null;
  for(const t of [s.title,...(s.aliases||[])]){
    try{const r=await fetch(state.apiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});const j=await r.json();
      if(j.service&&j.service.id===id){gemma.phrases.set(id,t);return t;}}catch(e){}
  }
  return null;
}
// GBNF 文法：Gemma 只能輸出 gemma-parser.js 要的 JSON，intent 只能是 55 項服務 ID 或 out-of-scope
let grammarCache=null;
function gemmaGrammar(){
  if(grammarCache||!gemma.services)return grammarCache;
  const ids=[...gemma.services.map(s=>s.id),'out-of-scope'].map(id=>'"\\"'+id.replace(/[\\"]/g,'')+'\\""').join(' | ');
  grammarCache=[
    'root ::= "{\\"intent\\":" intent ",\\"routes\\":[" routes? "],\\"stop\\":" text ",\\"location\\":" text "}"',
    'intent ::= '+ids,
    'routes ::= route ("," route)*',
    'route ::= "\\"" [0-9A-Za-z紅藍棕橘綠小區間副線]+ "\\""',
    'text ::= "null" | "\\"" [^"\\\\]+ "\\""'
  ].join('\n');
  return grammarCache;
}
// 精簡版系統提示：沿用 gemma-parser.js 的指示，但去掉別名，長度約減少 60%，模擬器 CPU 上快很多
function gemmaPrompt(){return gemma.parser.buildSystemPrompt().replace(/｜別名：[^\n]*/g,'');}
// 回傳要送給後端的查詢文字；無法使用 Gemma 時回傳 null（改用原句）
async function gemmaQuery(text){
  try{
    if(!await gemmaReady())return null;
    const started=Date.now();toast('AI 正在理解您的問題…');
    const out=await llmGenerate(gemmaPrompt(),text);
    const p=gemma.parser.normalizeResult(out.text,text);
    console.log('[Gemma]',Date.now()-started,'ms',out.text,p);
    if(p.intent==='out-of-scope')return null;
    if(p.intent==='bus-arrivals')return p.routes.length?`${p.routes[0]}號公車${p.stop||''}幾點來`:'公車幾點來';
    return await phraseFor(p.intent);
  }catch(e){console.warn('[Gemma] fallback',e.code||e.message);return null;}
}
function safe(text){return String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(text){$('toast').textContent=text;$('toast').classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hide'),3400)}
function top(){compose.classList.toggle('hide',state.screen!=='chat');
  // 回到首頁按鈕：首頁不顯示；文字跟著介面語言
  $('backHome').classList.toggle('hide',state.screen==='home');$('backHomeText').textContent=tr('回到首頁','Home');}
// 回到語音助理首頁：先停止收音與朗讀，避免回首頁後還在聽或還在念
function goHome(){cancelRecognition();stopSpeak();state.awaitAnswer=false;state.apiContext=null;state.screen='home';render();main.scrollTop=0;}
// 介面語言跟著設定頁的「語音語言」：選 English 時整個介面改成英文（固定文字，開發階段撰寫，不是 AI 翻譯）
function isEn(){return String(state.language).startsWith('en')}
function tr(zh,en){return isEn()?en:zh}
function applyLang(){document.documentElement.lang=tr('zh-Hant','en');
  $('settingsBtn').setAttribute('aria-label',tr('設定','Settings'));$('miniMic').setAttribute('aria-label',tr('語音輸入','Voice input'));
  document.querySelector('label[for="messageInput"]').textContent=tr('輸入訊息','Message');
  input.placeholder=tr('在這裡輸入問題，按右側送出鍵查詢','Type your question here, then tap Send');$('sendBtn').setAttribute('aria-label',tr('傳送訊息','Send'));}
function render(){applyLang();top();if(state.screen==='home')home();if(state.screen==='listening')listening();if(state.screen==='chat')chat();if(state.screen==='services')services();if(state.screen==='mine')mine();if(state.screen==='settings')settings();}
// 首頁範例只放臺北通 App 本身就有的功能（卡證、悠遊卡綁定、優惠券；依 id.taipei/tpcd 功能介紹）
const EXAMPLES={zh:['我的虛擬卡證在哪裡看？','怎麼綁定悠遊卡？','臺北通的優惠券在哪裡？'],en:['Where can I see my virtual cards?','How do I link my EasyCard?','Where are my coupons?']};
function home(){const ex=EXAMPLES[isEn()?'en':'zh'];main.innerHTML=`<div class="hero"><div class="hero-content"><span class="avatar">${icon('i-sun',26)}</span>${tr('您好，想查什麼？','Hi, what would you like to know?')}</div></div><section class="home-surface"><div class="examples"><div class="examples-title">${tr('你可以這樣說','You can say')}</div><div class="chip-list">${ex.map(t=>`<button class="chip" data-example="${safe(t)}">${safe(t)}</button>`).join('')}</div>${state.useAPI?'':`<p class="tap-hint">${tr('目前預設為本機示範；設定可切換 Spring Boot 後端','Demo mode; turn on the backend in Settings')}</p>`}</div><!-- 麥克風固定在畫面下方（手指好按），聆聽畫面用同一個位置 --><div class="mic-dock"><button class="mic-button" id="bigMic" aria-label="${tr('按下開始語音輸入','Tap to start voice input')}">${icon('i-mic',75)}</button><div class="dock-below"><div class="home-title">${tr('點一下說話','Tap to speak')}</div><div class="home-sub">${tr('說完會自動送出','Your question is sent when you finish speaking')}</div></div></div></section>`;$('bigMic').onclick=startListening;document.querySelectorAll('[data-example]').forEach(x=>x.onclick=()=>send(x.dataset.example));}
function listening(){main.innerHTML=`<div class="hero listen-hero"><div class="live-heading"><span class="live-dot" aria-hidden="true"></span>${tr('語音輸入（即時轉文字）','Voice input (live captions)')}${state.offlineVoice?tr('・裝置端辨識',' · on-device'):''}</div><div id="liveTranscript" class="transcript placeholder" role="status" aria-live="polite" aria-atomic="true">${tr('請開始說話，辨識的文字會顯示在這裡…','Start speaking. Your words will appear here…')}</div><div class="transcript-count" id="transcriptCount">${countText(0)}</div></div><section class="home-surface listen-surface"><div class="listen-bottom"><p class="small-hint">${tr('語音辨識結果會同步顯示，點擊停止後直接查詢','Captions update as you speak. Tap stop to search.')}</p><button class="cancel-button" id="cancelListen">${tr('取消並返回','Cancel')}</button></div><!-- 與首頁同一個位置：使用者不用移動手指就能按停止 --><div class="mic-dock"><div class="mic-wrap"><span class="ripple r1" aria-hidden="true"></span><span class="ripple r2" aria-hidden="true"></span><button class="mic-button listening audio-reactive" id="stopMic" aria-label="${tr('點擊停止語音輸入','Tap to stop voice input')}">${icon('i-mic',75)}</button></div><div class="dock-below"><div class="home-title">${tr('點擊停止','Tap to stop')}</div><div class="home-sub">${tr('正在聆聽您的需求…','Listening…')}</div></div></div></section>`;$('stopMic').onclick=stopListening;$('cancelListen').onclick=()=>{cancelRecognition();state.screen=state.originalScreen;render()};}
// 長語音：單次辨識結果可能因瀏覽器停頓而結束，因此保留已確定的文字後重新啟動。
// 沒有設定 25 字上限；100 字以上也可持續累積，直到使用者主動點擊停止。
function countText(t){t=String(t||'');return isEn()?`${t.trim()?t.trim().split(/\s+/).length:0} words recognized`:`已辨識 ${[...t].length} 字（支援 100 字以上）`}
// 收音音量（0–1）→ 麥克風按鈕縮放與外圈波紋；App 內來自原生 soundLevel 事件，瀏覽器內來自 Web Audio
function setMicLevel(power){const mic=$('stopMic');if(!mic)return;const p=Math.max(0,Math.min(1,power));
  mic.style.setProperty('--sound-scale',(1+p*.18).toFixed(3));mic.style.setProperty('--sound-halo',(13+p*30).toFixed(1)+'px');
  const wrap=mic.parentElement;if(wrap&&wrap.classList.contains('mic-wrap'))wrap.style.setProperty('--level',p.toFixed(2));}
function displayTranscript(){
  const el=$('liveTranscript');
  if(el){
    el.textContent=state.transcript||tr('請開始說話，辨識的文字會顯示在這裡…','Start speaking. Your words will appear here…');
    el.classList.toggle('placeholder',!state.transcript);
    el.scrollTop=el.scrollHeight;
  }
  const counter=$('transcriptCount');
  if(counter)counter.textContent=countText(state.transcript);
}
// 麥克風音量視覺化：在使用者授權時用 Web Audio API 分析音量，驅動圓形光圈。
async function startAudioMeter(){
  if(!navigator.mediaDevices?.getUserMedia)return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    if(!state.listening){stream.getTracks().forEach(t=>t.stop());return;}
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx){stream.getTracks().forEach(t=>t.stop());return;}
    const ctx=new Ctx();const source=ctx.createMediaStreamSource(stream),analyser=ctx.createAnalyser();
    analyser.fftSize=512;source.connect(analyser);
    state.audioStream=stream;state.audioCtx=ctx;state.audioAnalyser=analyser;
    const bytes=new Uint8Array(analyser.fftSize);
    function frame(){
      if(!state.listening)return;
      analyser.getByteTimeDomainData(bytes);
      let sum=0;for(const v of bytes){const a=(v-128)/128;sum+=a*a;}
      const rms=Math.sqrt(sum/bytes.length);
      setMicLevel(rms*9);
      state.audioFrame=requestAnimationFrame(frame);
    }
    frame();
  }catch(e){/* 未允許分析音量時仍可使用基本錄音與 CSS 呼吸效果 */}
}
function stopAudioMeter(){
  if(state.audioFrame)cancelAnimationFrame(state.audioFrame);
  state.audioFrame=null;
  state.audioStream?.getTracks().forEach(t=>t.stop());state.audioStream=null;
  if(state.audioCtx)state.audioCtx.close().catch(()=>{});
  state.audioCtx=null;state.audioAnalyser=null;
}
function startListening(){
  if(state.listening)return;
  state.awaitAnswer=false;
  state.originalScreen=state.screen;
  state.screen='listening';state.listening=true;
  state.stopRequested=false;state.recognitionError=false;
  state.transcript='';state.recognitionBase='';state.recognitionFinal='';state.recognitionInterim='';
  render();
  // App 內由原生端收音；不可再用 getUserMedia 搶麥克風
  if(tp){stopSpeak();tpSend('startListening',{offline:!!state.offlineVoice,lang:String(state.language).startsWith('en')?'en':'zh'});return;}
  startAudioMeter();
  const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Speech){toast('此瀏覽器不支援語音辨識，請改用文字輸入');cancelRecognition();state.screen='chat';render();input.focus();return;}
  function launch(){
    if(!state.listening||state.stopRequested)return;
    try{
      const rec=new Speech();state.recognition=rec;
      rec.lang=state.language;
      rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
      state.recognitionFinal='';state.recognitionInterim='';
      rec.onresult=e=>{
        if(!state.listening)return;
        // 每次從整個 results 清單重新組合，避免 resultIndex 造成舊文字遺失或重複。
        let finalized='',interim='';
        for(let i=0;i<e.results.length;i++){
          const value=e.results[i][0].transcript.trim();
          if(e.results[i].isFinal)finalized+=(finalized?' ':'')+value;
          else interim+=(interim?' ':'')+value;
        }
        state.recognitionFinal=finalized;
        state.recognitionInterim=interim;
        state.transcript=[state.recognitionBase,finalized,interim].filter(Boolean).join(' ').trim();
        displayTranscript();
      };
      rec.onerror=e=>{
        if(!state.listening)return;
        if(e.error==='no-speech'||(e.error==='aborted'&&state.stopRequested))return;
        // 無權限、音訊設備問題等錯誤，避免無止盡重啟。
        toast('語音辨識無法繼續：'+e.error+'，未自動送出。');
        state.stopRequested=false;
        state.recognitionError=true;
      };
      rec.onend=()=>{
        if(!state.listening)return;
        const part=state.recognitionFinal||state.recognitionInterim;
        state.recognitionBase=[state.recognitionBase,part].filter(Boolean).join(' ').trim();
        state.transcript=state.recognitionBase;
        state.recognitionFinal='';state.recognitionInterim='';
        displayTranscript();
        state.recognition=null;
        if(state.stopRequested){finishListening();return;}
        if(state.recognitionError){const draft=state.transcript;state.recognitionError=false;cancelRecognition();state.screen='chat';render();input.value=draft;return;}
        // Chrome 等瀏覽器可能在停頓後自行結束辨識，重新啟動並累積逐字稿。
        state.restartTimer=setTimeout(()=>{state.restartTimer=null;launch();},200);
      };
      rec.start();
    }catch(e){
      if(state.listening){const draft=state.transcript;cancelRecognition();state.screen='chat';render();input.value=draft;toast('語音辨識中斷，內容保留在輸入框，尚未送出');}
    }
  }
  launch();
}
function cancelRecognition(){
  if(tp&&state.listening)tpSend('stopListening');
  stopAudioMeter();
  state.listening=false;state.stopRequested=false;
  clearTimeout(state.restartTimer);state.restartTimer=null;
  const r=state.recognition;state.recognition=null;
  if(r){r.onresult=null;r.onend=null;r.onerror=null;try{r.abort()}catch(e){}}
  state.recognitionBase='';state.recognitionFinal='';state.recognitionInterim='';state.transcript='';
}
function finishListening(){
  const text=(state.transcript||'').trim();
  cancelRecognition();
  if(text){ send(text); }
  else { state.screen='chat';render();toast('尚未辨識到文字，請重新錄音或手動輸入'); }
}
function stopListening(){
  if(!state.listening||state.stopRequested)return;
  state.stopRequested=true;
  // App 內：請原生端停止，已說的內容會以 isFinal 回傳後再查詢
  if(tp){tpSend('stopListening');return;}
  clearTimeout(state.restartTimer);state.restartTimer=null;
  const r=state.recognition;
  // stop() 允許瀏覽器送出最後的辨識結果，再由 onend 送出完整文字。
  if(r){try{r.stop()}catch(e){finishListening();}}
  else finishListening();
}

async function send(text){
 text=String(text||'').trim();if(!text||state.apiBusy)return;
 if([...text].length>1500){toast('最多支援1500字，請縮短內容');return;}
 cancelRecognition();state.apiBusy=true;state.conversation.push({role:'user',text});state.screen='chat';input.value='';render();
 if(state.useAPI){
   if(!state.apiUrl){addAI('尚未設定後端 API，請至右上角設定填入 /api/v1/query。');state.apiBusy=false;return;}
   try{
     // 規則優先：先用原句查後端（約 1 秒）；只有後端聽不懂（OUT_OF_SCOPE），
     // 且不是補問中的後續回答時，才交給裝置端 Gemma 理解，再用它找出的服務重新查詢。
     const ask=async(q,ctx)=>{const r=await fetch(state.apiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:q,context:ctx})});if(!r.ok)throw Error('HTTP '+r.status);return r.json();};

     const notOffered=/^台北通目前沒有提供「/.test(String(result.speech||''));

     }
     state.apiContext=result.context||null;
     const service=result.service||{},url=service.officialUrl||'';

   finally{state.apiBusy=false;}

function settings(){main.innerHTML=`<div class="settings"><h2>${tr('語音助理設定','Assistant settings')}</h2>${DEV?`<label for="apiUrl">${tr('後端 API 網址','Backend API URL')}</label><input id="apiUrl" type="url" placeholder="http://localhost:8080/api/ask" value="${safe(state.apiUrl)}"><div class="toggle-row"><label for="useAPI">${tr('啟用後端查詢','Use backend search')}</label><input id="useAPI" type="checkbox" ${state.useAPI?'checked':''}></div>`:''}<div class="toggle-row"><label for="autoSpeak">${tr('自動朗讀系統回答','Read replies aloud')}</label><input id="autoSpeak" type="checkbox" ${state.autoSpeak?'checked':''}></div><div class="toggle-row"><label for="offlineVoice">${tr('語音辨識不使用 Google（裝置端辨識，較慢；查詢仍需網路）','On-device speech recognition, no Google (slower; searching still needs internet)')}</label><input id="offlineVoice" type="checkbox" ${state.offlineVoice?'checked':''}></div><label for="lang">${tr('語音語言','Language')}</label><select id="lang"><option value="zh-TW">國語（臺灣）</option><option value="en-US">English</option></select><p class="note">${tr('此設定適用於介面、語音輸入和朗讀。選 English 時以英文回答；服務說明的英文版為開發階段預先翻譯。','Applies to the screen, voice input and read-aloud. Service descriptions were translated in advance during development (not live AI).')}</p><button id="saveSettings" class="primary">${tr('儲存設定','Save')}</button>${aboutSection()}</div>`;$('lang').value=state.language;$('saveSettings').onclick=()=>{
  // 後端網址與開關只在 ?dev=1 時顯示，平常不更動
  if(DEV){let url=$('apiUrl').value.trim();if(url&&!/^https?:\/\//i.test(url)){toast(tr('請輸入完整的 http 或 https 網址','Please enter a full http or https URL'));return}state.apiUrl=url;state.useAPI=$('useAPI').checked;}  state.autoSpeak=$('autoSpeak').checked;state.offlineVoice=$('offlineVoice').checked;try{localStorage.setItem('offlineVoice',state.offlineVoice?'1':'0')}catch(e){}state.language=$('lang').value;state.screen='home';render();toast(tr('設定已儲存（本次開啟期間）','Settings saved (until you close this page)'))}}

$('settingsBtn').onclick=()=>{cancelRecognition();state.screen='settings';render();main.scrollTop=0/* 開啟設定時捲回頂端，避免停在對話頁的捲動位置 */};$('backHome').onclick=goHome;$('sendBtn').onclick=()=>send(input.value);$('miniMic').onclick=startListening;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send(input.value)}});render();
})();
</script>
</body></html>
