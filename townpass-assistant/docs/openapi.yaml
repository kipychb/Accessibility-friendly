openapi: 3.1.0
info:
  title: 台北通無障礙語音助理
  version: 1.0.0
servers:
  - url: http://localhost:8080
security: []
paths:
  /api/v1/services:
    get:
      operationId: listServices
      summary: 列出官方服務
      responses:
        '200':
          description: 白名單
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
  /api/v1/query:
    post:
      operationId: queryAssistant
      summary: 查詢中文語音逐字稿
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 400
                  examples: ['一號公車華江站往松仁路幾點來']
                context:
                  oneOf:
                    - $ref: '#/components/schemas/Context'
                    - type: 'null'
      responses:
        '200':
          description: 答案、補問或官方指引
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reply'
        '400':
          description: 輸入缺漏或格式不合法
components:
  schemas:
    Service:
      type: object
      required: [id, title, mode, category, aliases, authority, officialUrl, sourceUrl, scopeEvidenceUrl, summary]
      properties:
        id: {type: string}
        title: {type: string}
        mode: {type: string, enum: [LIVE, GUIDE]}
        category: {type: string}
        aliases:
          type: array
          items: {type: string}
        authority: {type: string}
        officialUrl: {type: string, format: uri}
        sourceUrl: {type: string, format: uri}
        scopeEvidenceUrl: {type: string, format: uri}
        summary: {type: string}
    Context:
      type: object
      properties:
        route: {type: string, maxLength: 40}
        stop: {type: string, maxLength: 80}
        direction: {type: integer, enum: [0, 1]}
        stopId: {type: integer, format: int64, minimum: 1}
        draft: {type: string, maxLength: 400}
    Arrival:
      type: object
      required: [routeId, route, stopId, stop, direction, destination, status]
      properties:
        routeId: {type: integer, format: int64}
        route: {type: string}
        stopId: {type: integer, format: int64}
        stop: {type: string}
        direction: {type: integer, enum: [0, 1]}
        destination: {type: string}
        status:
          type: string
          enum: [DUE, ESTIMATED, NOT_DEPARTED, SKIPPED, LAST_PASSED, NO_SERVICE, NO_ESTIMATE]
        estimateSeconds: {type: integer, minimum: 0}
    Reply:
      type: object
      required: [type, speech]
      properties:
        type:
          type: string
          enum: [ANSWER, CLARIFY, GUIDANCE, NO_RESULT, UPSTREAM_UNAVAILABLE, OUT_OF_SCOPE]
        speech: {type: string}
        service:
          $ref: '#/components/schemas/Service'
        updatedAt: {type: string, format: date-time}
        arrivals:
          type: array
          items:
            $ref: '#/components/schemas/Arrival'
        context:
          $ref: '#/components/schemas/Context'
        choices:
          type: array
          items:
            type: object
            required: [label, context]
            properties:
              label: {type: string}
              context:
                $ref: '#/components/schemas/Context'
        draft:
          type: object
          required: [description, location]
          properties:
            description: {type: string}
            location: {type: string}
